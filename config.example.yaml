# AI Fluency Collector - Team Configuration
#
# Copy this file to your team config (e.g., my-team.yaml) and fill in the values.
# Do not commit your team config — it is gitignored by default.

team:
  # Display name for the team
  name: "My Team"

  # Short identifier used in output filenames (e.g., my-team-2026-W12.json)
  code: "my-team"

  # GitLab instance URL (optional, defaults to https://gitlab.com)
  # Uncomment and change for self-hosted GitLab instances:
  # gitlab_url: "https://gitlab.example.com"

  # List of team member GitLab usernames
  # Used to discover AI adoption signals across all repos members touch
  # (e.g., co-authored commits with Claude, Copilot, Cursor)
  members:
    - "alice.smith"
    - "bob.jones"

  # List of GitLab project paths to scan (namespace/project format)
  # These are scanned for AI tool artifacts and CI patterns
  # Must be accessible with your GITLAB_TOKEN
  #
  # Use the path as it appears in your browser URL:
  #   https://gitlab.com/my-group/project-one  →  "my-group/project-one"
  #
  # For projects inside nested subgroups, include the full path:
  #   https://gitlab.com/my-org/platform/backend/api  →  "my-org/platform/backend/api"
  projects:
    - "my-group/project-one"
    - "my-group/project-two"
    - "my-group/subgroup/project-three"
    - "my-org/platform/backend/api"
